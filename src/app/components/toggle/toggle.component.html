<form [formGroup]="form">
  <div class="p-3 toggle-clickable-wrap">
    <div (click)="toggle()">Yesterday<br/>Patients</div>
    <div class="on-off-toggle">
      <input formControlName="value" class="on-off-toggle__input toggle-clickable-input" type="checkbox" id="toggle" (input)="toggle()" />
      <label for="toggle" class="on-off-toggle__slider"></label>
    </div>
  </div>
</form>
