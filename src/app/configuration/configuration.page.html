<ion-content [fullscreen]="true">
  <div class="d-flex align-items-center flex-column justify-content-between" style="height: 100%;">
    <div>
      <img class="logo" src="assets/logos/StatusBoard_Black.png" alt="logo" style="margin-top: 15px;" />
    </div>
    <div style="min-width: 300px; max-width: 400px;">
      <form [formGroup]="form">
        <div class="text-center">
          <h1><b>Configuration Mode</b></h1>
          <!-- <span *ngIf="waiting_rooms.length > 1">Please select Waiting Room:</span> -->
          <span *ngIf="waiting_rooms.length <= 1">Configuration for: {{ selectedBranchName }}</span>
        </div>
        <br />
        <br />
            <!-- Mostrar selector solo si hay más de un waiting room -->
            <ion-select *ngIf="waiting_rooms.length > 1" fill="outline" aria-label="Waiting Rooms" formControlName="waitingRoom" interface="popover" placeholder="Select Waiting Room">
              <ion-select-option [value]="room" *ngFor="let room of waiting_rooms">{{room.name}}</ion-select-option>
            </ion-select>
            
            <!-- Mostrar info del waiting room seleccionado automáticamente -->
            <div *ngIf="waiting_rooms.length <= 1 && selectedWaitingRoomName" class="selected-room-info">
              <ion-item lines="none">
                <ion-icon name="checkmark-circle" color="success" slot="start"></ion-icon>
                <ion-label>
                  <h3>Waiting Room: {{ selectedWaitingRoomName }}</h3>
                  <p>Automatically selected</p>
                </ion-label>
              </ion-item>
            </div>
          <br/>
            <ion-input fill="outline" label="Station Location" formControlName="stationName" label-placement="floating"
              errorText="Station Location is Required"></ion-input>
          <br />
            <ion-select fill="outline" aria-label="Application" formControlName="aplication" interface="popover" placeholder="Application" (ionChange)="onApplicationChange($event)">
              <ion-select-option value="1">Tablet</ion-select-option>
              <ion-select-option value="2">Dashboard Card View</ion-select-option>        
              <ion-select-option value="3">Dashboard List View</ion-select-option>        
            </ion-select>
          <br *ngIf="selectedApplication !== '1'"/>
          <ion-select *ngIf="selectedApplication !== '1'"  multiple="true" formControlName="statuses" fill="outline" aria-label="Status to Show" interface="popover" placeholder="Status to Show" (ionChange)="onStatusChange($event)">
            <ion-select-option [value]="status.id" *ngFor="let status of statuses">{{status.name}}</ion-select-option>              
          </ion-select>
          <div *ngIf="selectedApplication !== '1' && form.hasError('statusRequired') && (form.get('statuses')?.touched || form.touched)" class="error-message">
            <small style="color: var(--ion-color-danger);">Please select at least one status</small>
          </div>
          <br *ngIf="selectedApplication !== '1'"/>
            <!-- <ion-input *ngIf="this.selectedApplication !== '1'" fill="outline" [value]="formattedTime" placeholder="HH:MM - HH:MM" (ionFocus)="openTimeRangePicker()"></ion-input> -->
          
        <br />
        <ion-button class="w-100" color="primary" size="large" [disabled]="form.invalid"
          (click)="save()">SAVE</ion-button>
      </form>
    </div>
    <div>
      <img class="logo" src="assets/logos/DTouchmedia_Black.png" alt="logo" style="margin-bottom: 15px;"/>
    </div>
  </div>
</ion-content>
