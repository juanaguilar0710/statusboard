<div class="activation-wrapper">
  <div class="activation-card">
    <img class="brand-logo" src="assets/logos/DTouchmedia_Black.png" alt="DTouch" />

    <p class="activation-title">Activation Code</p>
    <div class="activation-code-box">
      <span class="activation-code">{{ activationCode }}</span>
    </div>

    <p class="time-label">Time remaining:</p>
    <div class="time-row">
      <p class="time-value">{{ timeRemaining }}</p>
      <button
        type="button"
        class="refresh-code-button"
        (click)="refreshActivationCode()"
        [disabled]="isRegistering"
        aria-label="Refresh activation code"
      >
        <ion-icon [name]="isRegistering ? 'hourglass-outline' : 'refresh-outline'"></ion-icon>
      </button>
    </div>

    <p class="activation-help">
      To fully control this display, just enter the display code in the portal to activate it.
    </p>

    <div class="registering" *ngIf="isRegistering">
      <ion-spinner name="crescent"></ion-spinner>
      <span>Registering device...</span>
    </div>

    <div class="activation-footer">
      <span class="version-tag">v{{ version }}</span>
      <button
        type="button"
        class="update-button"
        (click)="checkForUpdatesManually()"
        [disabled]="isCheckingForUpdates"
        aria-label="Check for updates"
      >
        <ion-icon [name]="isCheckingForUpdates ? 'hourglass-outline' : 'cloud-download-outline'"></ion-icon>
      </button>


    </div>
  </div>
</div>
