<ion-content [fullscreen]="true">
  <div class="d-flex flex-column justify-content-between h-100 text-center">
    <div>
      <img class="img-fluid logo" src="assets/logos/StatusBoard_Black.png" alt="logo" />
    </div>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <form [formGroup]="form">
            <div>
              <h1><b>Welcome</b></h1>
              <span>Please login with admin account</span>
            </div>
            <br />
            <ion-input tabindex="1" label="Username" formControlName="username" label-placement="floating" fill="outline"
              errorText="Username required" [readonly]="loading" [disabled]="loading"></ion-input>
            <br />
            <ion-item fill="outline">
              <ion-input
                tabindex="2"
                label="Password"
                formControlName="password"
                label-placement="floating"
                [type]="showPassword ? 'text' : 'password'"
                errorText="Password required"
                (keyup.enter)="login()"
                [readonly]="loading"
                [disabled]="loading"
                style="text-align: center;">
              </ion-input>
              <ion-button fill="clear" slot="end" (click)="togglePassword()" style="font-size: 1.5rem;">
                <ion-icon [name]="showPassword ? 'eye-off' : 'eye'"></ion-icon>
              </ion-button>
            </ion-item>
              
            <br />
              <p *ngIf="this.two_fa_source === 'sms'" class="text-center" style="color: black; margin-bottom: 20px;">We've sent a access code to your phone.</p> <!-- sms -->
              <p *ngIf="this.two_fa_source === 'app'" class="text-center" style="color: black; margin-bottom: 20px;">Open you two-factor authenticator (TOTP) app or browser extension to view your authentication code.</p><!-- qr -->
              <p *ngIf="this.two_fa_source === 'email'" class="text-center" style="color: black; margin-bottom: 20px;">We've sent a access code to your email.</p> <!-- email -->
            
              <ion-input 
              hidden 
              #twoFactorCode 
              tabindex="3" 
              label="2FA Code"  
              label-placement="floating" 
              fill="outline"
              errorText="Code is required"
              formControlName="code">
            </ion-input>
              <br/>
            <ion-button *ngIf="!authenticationRequired" class="w-100" color="primary" size="large" [disabled]="form.invalid || loading"
              (click)="login()"><ion-spinner name="dots" *ngIf="loading"></ion-spinner>{{loading ? '' : 'LOGIN'}}</ion-button>

              <ion-button *ngIf="authenticationRequired" class="w-100" color="primary" size="large"
              (click)="verifyTwoFactorCode()"><ion-spinner name="dots" *ngIf="loading"></ion-spinner>{{loading ? '' : 'Validate Code'}}</ion-button>

          </form>
        </div>
      </div>
    </div>
    <div>
      <img class="img-fluid logo" src="assets/logos/DTouchmedia_Black.png" alt="logo" />
    </div>
  </div>
</ion-content>
